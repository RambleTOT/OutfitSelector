# /etc/nginx/sites-available/atelier  ->  ln -s в sites-enabled, затем: nginx -t && systemctl reload nginx
# Замени your-domain.ru на свой домен. Сертификат выпускает certbot (docs/DEPLOY.md, шаг 7)

# админка: не больше 30 запросов в минуту с адреса (всплеск до 60)
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru www.your-domain.ru;
    return 301 https://your-domain.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.ru;

    ssl_certificate     /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/atelier;        # сюда деплоится папка dist
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    client_max_body_size 8m;       # фото вещей

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;

    # API и фото: на Node-сервер
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # распознавание фото на CPU может идти до 30 секунд
    }

    # админка: закрыта от индексации и встраивания, строгая политика содержимого, без кэша
    location ^~ /admin/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /api/admin/ {
        limit_req zone=admin burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # файлы с хэшем в имени кэшируются навсегда
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /items/  { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location /icons/  { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location /landing/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # service worker и манифест всегда свежие, иначе обновления не доедут до людей
    location = /app/sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /app/manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }

    # лендинг на /, приложение на /app/
    location /app/ { try_files $uri $uri/ /app/index.html; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}

# www на https тоже уходит на основной адрес
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.your-domain.ru;
    ssl_certificate     /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;
    return 301 https://your-domain.ru$request_uri;
}
