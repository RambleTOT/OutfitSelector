<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Atelier · ролик</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="stage.css">
<script src="assets/icons.js"></script>
</head>
<body>
<div id="stage" class="phone-hidden">
  <div id="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <div id="brand"><span class="serif">Atelier</span></div>

  <div id="content">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="info"></div>
  </div>

  <div id="phone">
    <div class="frame">
      <div class="screen">
        <iframe id="app" src="/app/index.html?demo#/splash" title="Atelier" width="390" height="844"></iframe>
        <div class="status"><span>9:41</span><span class="sr">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M3.9 6.9a6 6 0 0 1 8.2 0M6.3 9.5a2.6 2.6 0 0 1 3.4 0"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="currentColor"/><rect x="24" y="4.2" width="2" height="4.6" rx="1" fill="currentColor" opacity=".4"/></svg>
        </span></div>
        <div class="island"></div>
        <div class="home"></div>
      </div>
    </div>
  </div>

  <div id="tap"></div>

  <div id="intro">
    <i class="glow"></i>
    <div class="intro-in">
      <div class="serif intro-logo">Atelier</div>
      <div class="intro-tag">Новые образы из твоих вещей</div>
      <div class="intro-sub">AI-стилист в телефоне · прототип</div>
    </div>
  </div>

  <div id="outro">
    <i class="glow"></i>
    <div class="outro-in">
      <div class="serif outro-logo">Atelier</div>
      <div class="outro-tag">Носи больше, покупай меньше</div>
      <div class="outro-props">
        <div><span id="o1"></span><b>Из твоих вещей</b></div>
        <div><span id="o2"></span><b>Под погоду и повод</b></div>
        <div><span id="o3"></span><b>Без лишних трат</b></div>
      </div>
    </div>
    <div class="credit">Фото вещей: Unsplash · Прототип приложения для защиты проекта</div>
  </div>

  <div id="progress"><i></i></div>
</div>
<script src="stage.js"></script>
</body>
</html>
